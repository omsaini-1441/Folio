<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0c" />

    <title>Om Saini | Full-Stack Developer</title>
    <meta
      name="description"
      content="Om Saini is a full-stack developer building production event-driven systems: message pipelines, real-time sync engines and multi-tenant Docker infrastructure, wrapped in interfaces that feel effortless."
    />
    <meta name="author" content="Om Saini" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Om Saini" />
    <meta property="og:title" content="Om Saini | Full-Stack Developer" />
    <meta
      property="og:description"
      content="Production event-driven systems, real-time sync and multi-tenant infrastructure, wrapped in interfaces that feel effortless."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Om Saini | Full-Stack Developer" />
    <meta
      name="twitter:description"
      content="Production event-driven systems, real-time sync and multi-tenant infrastructure, wrapped in interfaces that feel effortless."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.jpg" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Self-hosted latin variable fonts. Declared here (not in the Vite CSS)
      so the preloaded Syne file is used on first paint, before JS arrives.
    -->
    <link
      rel="preload"
      href="/fonts/syne-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: Syne;
        src: url("/fonts/syne-latin-wght-normal.woff2") format("woff2");
        font-weight: 400 800;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Instrument Sans";
        src: url("/fonts/instrument-sans-latin-wght-normal.woff2") format("woff2");
        font-weight: 400 700;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 800;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      html {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        background: #0b0b0c;
        color: #f1efe6;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 300;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-sizing: border-box;
        padding: 1.5rem;
        background: #0b0b0c;
      }
      @media (min-width: 768px) {
        #boot {
          padding: 2.5rem;
        }
      }
      #boot .meta {
        display: flex;
        justify-content: space-between;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #8f8d84;
      }
      #boot .row {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 1rem;
      }
      #boot .hint {
        max-width: 20rem;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 0.75rem;
        line-height: 1.65;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #8f8d84;
      }
      #boot .count {
        font-family: Syne, Impact, sans-serif;
        font-weight: 800;
        font-size: 18vw;
        line-height: 1;
        color: #f1efe6;
      }
      @media (min-width: 768px) {
        #boot .count {
          font-size: 10rem;
        }
      }
    </style>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Om Saini",
        "url": "%VITE_SITE_URL%/",
        "image": "%VITE_SITE_URL%/og.jpg",
        "jobTitle": "Full-Stack Developer",
        "email": "mailto:omsaini.tech@gmail.com",
        "address": { "@type": "PostalAddress", "addressLocality": "Chandigarh", "addressCountry": "IN" },
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "Chitkara University" },
        "knowsAbout": [
          "Node.js",
          "NestJS",
          "React",
          "TypeScript",
          "MongoDB",
          "PostgreSQL",
          "RabbitMQ",
          "Docker",
          "Redis"
        ],
        "sameAs": [
          "https://github.com/omsaini-1441",
          "https://linkedin.com/in/om-saini",
          "https://leetcode.com/u/om_saini"
        ]
      }
    </script>
  </head>
  <body>
    <!-- Paints immediately so first contentful paint is not gated on JS. -->
    <div id="boot" aria-hidden="true">
      <div class="meta">
        <span>Om Saini</span>
        <span>Portfolio © 2026</span>
      </div>
      <div class="row">
        <p class="hint">Loading the good stuff: fonts, easing curves &amp; questionable confidence</p>
        <span class="count">0</span>
      </div>
    </div>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; color: #f1efe6; font-family: sans-serif">
        <h1>Om Saini &mdash; Full-Stack Developer</h1>
        <p>This portfolio needs JavaScript enabled. Reach me at omsaini.tech@gmail.com.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
